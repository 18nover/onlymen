name: Engineering office

on:
  pull_request:
    paths:
      - ".github/workflows/engineering-office.yml"
      - "eliza/packages/org/**"
      - "eliza/plugins/plugin-org-coordinator/**"
      - "scripts/dev/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/engineering-office.yml"
      - "eliza/packages/org/**"
      - "eliza/plugins/plugin-org-coordinator/**"
      - "scripts/dev/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eliza
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/org verify
      - run: bun run --cwd plugins/plugin-org-coordinator typecheck
      - run: bun run --cwd plugins/plugin-org-coordinator lint
