<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnlyMen Engineering Office</title>
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.16 0.015 260);
    --panel: oklch(0.2 0.018 260);
    --raised: oklch(0.25 0.02 260);
    --border: oklch(0.36 0.025 260);
    --text: oklch(0.94 0.01 260);
    --dim: oklch(0.68 0.025 260);
    --accent: oklch(0.72 0.17 45);
    --good: oklch(0.7 0.15 145);
    --warn: oklch(0.78 0.15 85);
    --bad: oklch(0.65 0.2 30);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 280px 1fr;
  }
  button, input, textarea, select { font: inherit; }
  button {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--raised);
    color: var(--text);
    padding: 8px 12px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 700; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: 0.45; cursor: default; }
  aside {
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 16px 12px;
    overflow-y: auto;
  }
  .brand { font-weight: 800; font-size: 17px; margin: 0 8px 2px; }
  .subtitle { color: var(--dim); font-size: 12px; margin: 0 8px 16px; }
  .agent {
    width: 100%;
    text-align: left;
    border-color: transparent;
    background: transparent;
    margin-bottom: 4px;
  }
  .agent:hover, .agent.active { background: var(--raised); }
  .agent.active { border-color: var(--accent); }
  .agent-name { display: flex; justify-content: space-between; font-weight: 650; }
  .agent-role { color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--dim); }
  .dot.ready { background: var(--good); }
  .dot.booting { background: var(--warn); }
  .dot.error { background: var(--bad); }
  main { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
  nav {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  nav button.active { border-color: var(--accent); color: var(--accent); }
  #connection { margin-left: auto; color: var(--dim); font-size: 12px; }
  #view { overflow-y: auto; padding: 22px; }
  .columns { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2, .card h3 { margin: 0 0 8px; }
  .meta { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 7px; border: 1px solid var(--border); border-radius: 99px; font-size: 11px; margin-right: 5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  form { display: grid; gap: 10px; }
  input, textarea, select {
    width: 100%;
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
  }
  textarea { min-height: 84px; resize: vertical; }
  label { display: grid; gap: 5px; color: var(--dim); font-size: 12px; }
  #chat { height: calc(100vh - 105px); display: grid; grid-template-rows: auto 1fr auto; }
  #messages { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 0; }
  .message { max-width: 72ch; white-space: pre-wrap; padding: 10px 13px; border-radius: 10px; background: var(--raised); }
  .message.user { align-self: flex-end; background: var(--accent); color: var(--bg); }
  .message.system { align-self: center; background: transparent; color: var(--dim); font-style: italic; }
  #composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  #composer textarea { min-height: 56px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim); }
  @media (max-width: 900px) {
    body { grid-template-columns: 220px 1fr; }
    .columns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">OnlyMen</div>
  <div class="subtitle">Engineering Office</div>
  <div id="roster"></div>
</aside>
<main>
  <nav>
    <button type="button" data-view="chat" class="active">Conversation</button>
    <button type="button" data-view="work">Work board</button>
    <button type="button" data-view="approvals">Approvals</button>
    <button type="button" data-view="activity">Activity</button>
    <span id="connection">connecting</span>
  </nav>
  <section id="view"></section>
</main>
<script>
const state = {
  activeAgent: "andrew",
  activeView: "chat",
  roster: [],
  work: [],
  approvals: [],
  activity: [],
  messages: {},
  github: null,
};

const view = document.querySelector("#view");
const connection = document.querySelector("#connection");

function text(tag, value, className) {
  const node = document.createElement(tag);
  node.textContent = value;
  if (className) node.className = className;
  return node;
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || `${response.status} ${path}`);
  return body;
}

async function refresh() {
  const data = await api("/api/bootstrap");
  Object.assign(state, data);
  renderRoster();
  render();
}

function renderRoster() {
  const root = document.querySelector("#roster");
  root.replaceChildren();
  for (const agent of state.roster) {
    const button = document.createElement("button");
    button.className = `agent ${agent.id === state.activeAgent ? "active" : ""}`;
    const row = text("div", "", "agent-name");
    row.append(text("span", agent.name));
    row.append(text("span", "", `dot ${agent.status}`));
    button.append(row, text("div", agent.role.replaceAll("_", " "), "agent-role"));
    button.onclick = async () => {
      state.activeAgent = agent.id;
      state.activeView = "chat";
      await ensureMessages(agent.id);
      renderRoster();
      render();
      if (agent.status === "stopped") {
        await api(`/api/agents/${agent.id}/start`, { method: "POST" });
      }
    };
    root.append(button);
  }
}

async function ensureMessages(agentId) {
  state.messages[agentId] = await api(`/api/agents/${agentId}/messages`);
}

function render() {
  document.querySelectorAll("nav button").forEach((button) => {
    button.classList.toggle("active", button.dataset.view === state.activeView);
  });
  if (state.activeView === "chat") renderChat();
  if (state.activeView === "work") renderWork();
  if (state.activeView === "approvals") renderApprovals();
  if (state.activeView === "activity") renderActivity();
}

function renderChat() {
  const agent = state.roster.find((entry) => entry.id === state.activeAgent);
  if (!agent) return;
  view.replaceChildren();
  const root = document.createElement("div");
  root.id = "chat";
  const header = document.createElement("div");
  header.append(text("h2", agent.name), text("div", agent.bio.join(" "), "meta"));
  const messages = document.createElement("div");
  messages.id = "messages";
  for (const message of state.messages[agent.id] || []) {
    messages.append(text("div", message.text, `message ${message.role}`));
  }
  const composer = document.createElement("form");
  composer.id = "composer";
  const input = document.createElement("textarea");
  input.placeholder = `Message ${agent.name}`;
  const send = text("button", "Send", "primary");
  send.type = "submit";
  composer.append(input, send);
  composer.onsubmit = async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    state.messages[agent.id] = state.messages[agent.id] || [];
    state.messages[agent.id].push({ role: "user", text: message });
    state.messages[agent.id].push({ role: "system", text: "Thinking..." });
    renderChat();
    try {
      await api(`/api/agents/${agent.id}/chat`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message }),
      });
      await ensureMessages(agent.id);
    } catch (error) {
      state.messages[agent.id].pop();
      state.messages[agent.id].push({ role: "system", text: String(error) });
    }
    renderChat();
  };
  root.append(header, messages, composer);
  view.append(root);
  messages.scrollTop = messages.scrollHeight;
}

function renderWork() {
  view.replaceChildren();
  const layout = text("div", "", "columns");
  const list = document.createElement("div");
  for (const item of state.work) {
    const card = text("article", "", "card");
    card.append(text("h3", item.title));
    const meta = text("div", "", "meta");
    meta.append(
      text("span", item.id, "badge"),
      text("span", item.assignee, "badge"),
      text("span", item.status, "badge"),
      text("span", item.priority, "badge"),
    );
    card.append(meta, text("p", item.description));
    if (item.issue_url) {
      const link = text("a", `GitHub #${item.issue_number}`);
      link.href = item.issue_url;
      link.target = "_blank";
      card.append(link);
    }
    if (item.pull_request_url) {
      const link = text("a", "Draft pull request");
      link.href = item.pull_request_url;
      link.target = "_blank";
      card.append(link);
    }
    const actions = text("div", "", "actions");
    const execute = text("button", "Execute approved task", "primary");
    execute.disabled = item.execution_approval !== "approved" ||
      ["working", "review", "ready_for_human", "closed"].includes(item.status);
    execute.onclick = async () => {
      await api(`/api/work/${item.id}/execute`, { method: "POST" });
      await refresh();
    };
    const requestPublication = text("button", "Request publication approval");
    requestPublication.disabled = item.status !== "review" ||
      ["pending", "approved"].includes(item.publication_approval);
    requestPublication.onclick = async () => {
      await api(`/api/work/${item.id}/request-publication`, { method: "POST" });
      await refresh();
    };
    const publish = text("button", "Publish draft PR", "primary");
    publish.disabled = item.status !== "review" ||
      item.publication_approval !== "approved";
    publish.onclick = async () => {
      await api(`/api/work/${item.id}/publish`, { method: "POST" });
      await refresh();
    };
    actions.append(execute, requestPublication, publish);
    card.append(actions);
    list.append(card);
  }
  if (!state.work.length) list.append(text("p", "No work has been proposed.", "meta"));

  const formCard = text("aside", "", "card");
  formCard.append(text("h2", "Propose work"));
  const form = document.createElement("form");
  const title = document.createElement("input");
  title.required = true;
  const description = document.createElement("textarea");
  const assignee = document.createElement("select");
  for (const agent of state.roster) {
    const option = document.createElement("option");
    option.value = agent.id;
    option.textContent = `${agent.name} - ${agent.role.replaceAll("_", " ")}`;
    assignee.append(option);
  }
  const priority = document.createElement("select");
  for (const value of ["medium", "high", "critical", "low"]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    priority.append(option);
  }
  function field(label, input) {
    const root = text("label", label);
    root.append(input);
    return root;
  }
  form.append(
    field("Title", title),
    field("Description and acceptance criteria", description),
    field("Specialist", assignee),
    field("Priority", priority),
  );
  const submit = text("button", "Create proposal", "primary");
  submit.type = "submit";
  form.append(submit);
  form.onsubmit = async (event) => {
    event.preventDefault();
    await api("/api/work", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        title: title.value,
        description: description.value,
        assignee: assignee.value,
        priority: priority.value,
      }),
    });
    await refresh();
  };
  formCard.append(form);
  layout.append(list, formCard);
  view.append(layout);
}

function renderApprovals() {
  view.replaceChildren();
  const pending = state.approvals.filter((approval) => approval.status === "pending");
  for (const approval of pending) {
    const card = text("article", "", "card");
    card.append(
      text("h3", `${approval.kind} approval`),
      text("div", `${approval.work_item_id} - ${approval.title}`, "meta"),
      text("p", `Specialist: ${approval.assignee}`),
    );
    const actions = text("div", "", "actions");
    for (const decision of ["approved", "rejected"]) {
      const button = text(
        "button",
        decision === "approved" ? "Approve" : "Reject",
        decision === "approved" ? "primary" : "danger",
      );
      button.onclick = async () => {
        await api(`/api/approvals/${approval.id}/decision`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ decision }),
        });
        await refresh();
      };
      actions.append(button);
    }
    card.append(actions);
    view.append(card);
  }
  if (!pending.length) view.append(text("p", "No approvals are waiting.", "meta"));
}

function renderActivity() {
  view.replaceChildren();
  const github = text("div", "", "card");
  github.append(text("h3", "GitHub"));
  github.append(text("pre", JSON.stringify(state.github, null, 2)));
  view.append(github);
  for (const event of state.activity) {
    const card = text("article", "", "card");
    card.append(
      text("strong", event.summary),
      text("div", `${event.type} - ${event.created_at}`, "meta"),
    );
    view.append(card);
  }
}

document.querySelectorAll("nav button").forEach((button) => {
  button.onclick = () => {
    state.activeView = button.dataset.view;
    render();
  };
});

const events = new EventSource("/api/events");
events.onopen = () => { connection.textContent = "live"; };
events.onerror = () => { connection.textContent = "reconnecting"; };
let refreshTimer;
events.onmessage = () => {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (state.activeAgent) await ensureMessages(state.activeAgent);
    await refresh();
  }, 350);
};

refresh()
  .then(() => ensureMessages(state.activeAgent))
  .then(render)
  .catch((error) => {
    connection.textContent = "offline";
    view.append(text("pre", String(error)));
  });
</script>
</body>
</html>
